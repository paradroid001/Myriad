<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Myriad README</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #18211f;
        --muted: #5d6965;
        --line: #cdd8d3;
        --paper: #f6f4ee;
        --panel: #ffffff;
        --accent: #0d766e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        font-family:
          Avenir Next,
          Avenir,
          Segoe UI,
          sans-serif;
        background:
          linear-gradient(120deg, rgba(13, 118, 110, 0.1), transparent 34%),
          var(--paper);
      }

      main {
        width: min(920px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 56px;
      }

      nav {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        margin-bottom: 24px;
      }

      a {
        color: var(--accent);
      }

      .home {
        display: inline-flex;
        min-height: 36px;
        align-items: center;
        padding: 0 12px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.75);
        text-decoration: none;
      }

      article {
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.86);
        line-height: 1.62;
      }

      h1,
      h2,
      h3 {
        line-height: 1.16;
        letter-spacing: 0;
      }

      h1 {
        margin-top: 0;
        font-family:
          Georgia,
          Times New Roman,
          serif;
        font-size: clamp(2.2rem, 5vw, 4rem);
      }

      h2 {
        margin-top: 2rem;
        padding-top: 1.2rem;
        border-top: 1px solid var(--line);
      }

      code,
      pre {
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      code {
        padding: 0.12rem 0.28rem;
        border-radius: 4px;
        background: rgba(24, 33, 31, 0.08);
      }

      pre {
        overflow-x: auto;
        padding: 16px;
        border-radius: 8px;
        background: #18211f;
        color: #f6f4ee;
      }

      pre code {
        padding: 0;
        background: transparent;
        color: inherit;
      }

      blockquote {
        margin-left: 0;
        padding-left: 16px;
        border-left: 4px solid var(--accent);
        color: var(--muted);
      }

      .muted {
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <nav>
        <a class="home" href="index.html">Back to Dev Server</a>
        <a href="README.md">Raw Markdown</a>
      </nav>
      <article id="readme"><p class="muted">Loading README.md...</p></article>
    </main>

    <script>
      const container = document.getElementById("readme");

      function escapeHtml(value) {
        return value
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;");
      }

      function inlineMarkdown(value) {
        return escapeHtml(value)
          .replace(/`([^`]+)`/g, "<code>$1</code>")
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
          .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
          .replace(/\*([^*]+)\*/g, "<em>$1</em>");
      }

      function renderMarkdown(markdown) {
        const lines = markdown.replace(/\r\n/g, "\n").split("\n");
        const html = [];
        let inCode = false;
        let listOpen = false;
        let paragraph = [];

        function flushParagraph() {
          if (paragraph.length > 0) {
            html.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
            paragraph = [];
          }
        }

        function closeList() {
          if (listOpen) {
            html.push("</ul>");
            listOpen = false;
          }
        }

        for (const line of lines) {
          if (line.startsWith("```")) {
            flushParagraph();
            closeList();
            if (inCode) {
              html.push("</code></pre>");
              inCode = false;
            } else {
              html.push("<pre><code>");
              inCode = true;
            }
            continue;
          }

          if (inCode) {
            html.push(`${escapeHtml(line)}\n`);
            continue;
          }

          if (line.trim() === "") {
            flushParagraph();
            closeList();
            continue;
          }

          const heading = line.match(/^(#{1,3})\s+(.+)$/);
          if (heading) {
            flushParagraph();
            closeList();
            const level = heading[1].length;
            html.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }

          const listItem = line.match(/^[-*]\s+(.+)$/);
          if (listItem) {
            flushParagraph();
            if (!listOpen) {
              html.push("<ul>");
              listOpen = true;
            }
            html.push(`<li>${inlineMarkdown(listItem[1])}</li>`);
            continue;
          }

          if (line.startsWith("> ")) {
            flushParagraph();
            closeList();
            html.push(
              `<blockquote>${inlineMarkdown(line.slice(2))}</blockquote>`,
            );
            continue;
          }

          paragraph.push(line);
        }

        flushParagraph();
        closeList();
        return html.join("\n");
      }

      fetch("README.md", { cache: "no-store" })
        .then((response) => {
          if (!response.ok) {
            throw new Error("README.md unavailable");
          }
          return response.text();
        })
        .then((markdown) => {
          container.innerHTML = renderMarkdown(markdown);
        })
        .catch((error) => {
          container.innerHTML = `<p class="muted">${escapeHtml(error.message)}</p>`;
        });
    </script>
  </body>
</html>
